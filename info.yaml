project:
  title:        "F01 Traffic Light Controller"
  author:       "Le Xuan Viet"
  discord:      ""
  description:  "Moore FSM Traffic Light Controller with Night Mode"
  language:     "Verilog"
  clock_hz:     10000000
  tiles:        "1x1"

  # Tên Top Module Wrapper
  top_module:  "tt_um_f01_traffic_light"

  # Danh sách file mã nguồn RTL trong thư mục src/
  source_files:
    - "tt_um_f01_traffic_light.v"
    - "fsm_traffic_light.v"

  # Thông tin mô tả bắt buộc
  how_it_works: "A 4-state Moore FSM controlling 2-direction traffic lights with 10s Green, 3s Yellow, and Night Mode blink."
  how_to_test:  "Set rst_n high, apply clk. Toggle uio_in[0] for night mode."

# Sơ đồ gán chân I/O chuẩn định dạng Tiny Tapeout (dạng danh sách 8 chân)
pinout:
