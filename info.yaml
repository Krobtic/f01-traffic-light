    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
  uo:
    - "H1 Green LED"
    - "H1 Yellow LED"
    - "H1 Red LED"
    - "H2 Green LED"
    - "H2 Yellow LED"
    - "H2 Red LED"
    - "Unused"
    - "Unused"
  uio:
    - "Night Mode switch (1=Night, 0=Day)"
    - "Unused"
    - "Unused"
    - "Unused"
