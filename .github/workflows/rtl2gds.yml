name: RTL to GDSII

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MA_DE: F01
  DESIGN_NAME: tt_um_f01_traffic_light
  CONFIG: src/config.json

jobs:
  mo-phong:
    name: 1 - Mo phong RTL (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Ghi lai phien ban cong cu
        run: |
          iverilog -V | head -1 | tee tool_versions.txt
          echo "Ngay chay: $(date -Is)" | tee -a tool_versions.txt

      - name: Bien dich va chay testbench
        run: |
          shopt -s globstar nullglob
          FILES=(src/*.v src/*.sv 04_IMPLEMENTATION/rtl/*.sv 04_IMPLEMENTATION/rtl/*.v 05_VERIFICATION/testbench/*.sv 05_VERIFICATION/testbench/*.v)
          iverilog -g2012 -o sim.vvp "${FILES[@]}"
          vvp sim.vvp | tee simulation.log

      - name: Kiem log - phai co PASS va khong duoc co loi
        run: |
          if grep -qiE "FATAL|mismatch|\bFAIL\b" simulation.log; then
            echo "::error::Testbench bao loi - xem simulation.log"
            exit 1
          fi
          if ! grep -qi "PASS" simulation.log; then
            echo "::error::Khong thay dong PASS nao trong log"
            exit 1
          fi
          echo "Mo phong dat."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-phong-${{ env.MA_DE }}
          path: |
            simulation.log
            tool_versions.txt
            *.vcd
          if-no-files-found: warn

  rtl2gds:
    name: 2 - RTL-to-GDSII (LibreLane + sky130A)
    runs-on: ubuntu-latest
    needs: mo-phong
    steps:
      - uses: actions/checkout@v4

      - name: Cai Nix kem bo nho dem nhi phan cua FOSSi
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Lay LibreLane
        run: git clone --depth 1 https://github.com/librelane/librelane ~/librelane

      - name: Chay flow
        run: |
          cd ~/librelane
          nix-shell --run "cd '$GITHUB_WORKSPACE' && librelane --version && librelane '$CONFIG'"

      - name: Kiem SAN PHAM, khong chi kiem ma thoat
        run: |
          GDS=$(find . -name "*.gds" | head -1)
          MJ=$(find . -name "metrics.json" | head -1)
          if [ -z "$GDS" ]; then echo "::error::Khong sinh duoc file GDS"; exit 1; fi
          if [ -z "$MJ" ];  then echo "::error::Khong co metrics.json";   exit 1; fi
          echo "GDS: $GDS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl2gds-${{ env.MA_DE }}
          path: |
            **/runs/**/final/**
            **/runs/**/*.log
            **/metrics.json
            **/*.gds
          if-no-files-found: warn